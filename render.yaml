services:
  - type: web
    name: neurosense-multimodal-emotion-recognition
    runtime: python
    plan: free
    buildCommand: pip install -r NeuroSense/webdev/backend/requirements.txt
    startCommand: cd NeuroSense/webdev/backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.19
